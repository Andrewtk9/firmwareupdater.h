; Development and test harness for the library itself.
; Consuming projects do not use this file; they pull the library via lib_deps.

; `pio run`            -> builds the library + BoardInfo for the three real targets
; `pio test -e native` -> runs the host test suite (that env has no main())
[platformio]
default_envs = esp32dev, esp32-s3-devkitc-1, seeed_xiao_esp32s3

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<core/>
lib_deps = bblanchon/ArduinoJson@^7.0.0
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -I include
    -I src
    -I test

; The esp32 envs compile the library together with one example, so a plain
; `pio run` is a real end-to-end compile check. pio ci is avoided: with --lib=.
; it recursively copies the repo into itself.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = bblanchon/ArduinoJson@^7.0.0
build_src_filter = +<core/> +<platform/> +<../examples/BoardInfo/>
build_flags = -std=gnu++17 -I include -I src

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps = bblanchon/ArduinoJson@^7.0.0
build_src_filter = +<core/> +<platform/> +<../examples/BoardInfo/>
build_flags =
    -std=gnu++17
    -I include
    -I src
    -I test
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_unflags = -DBOARD_HAS_PSRAM
lib_deps = bblanchon/ArduinoJson@^7.0.0
build_src_filter = +<core/> +<platform/> +<../examples/BoardInfo/>
build_flags =
    -std=gnu++17
    -I include
    -I src
    -I test
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
